<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/_LOGIN/login.css?v=2" />
    <link rel="icon" type="image/x-icon" href="/assets/images/logo.ico" />
    <script src="/_LOGIN/login.js"></script>
    <title>Login</title>
  </head>
  <body>
    <form
      class="login-box"
      method="POST"
      action="/user/login"
      target="iframe-resposta"
    >
      <img src="/assets/images/logo.png" alt="" class="logo" />
      <h3>Login Administrativo</h3>
      <p>as informações são únicas, para acesso do cardapio</p>
      <hr />
      <h4>Identificador</h4>
      <div class="text-area" style="margin-bottom: 10px">
        <span class="material-icons">alternate_email</span>
        <input
          type="text"
          placeholder="Identificador..."
          name="email"
          id="identificator"
        />
      </div>
      <h4>Senha</h4>
      <div class="text-area">
        <span class="material-icons">password</span>
        <input
          type="password"
          placeholder="1234..."
          name="password"
          id="password"
        />
        <span
          class="material-icons showPass"
          onclick="togglePassword()"
        >visibility_off</span>
      </div>
      <p class="error-message" id="error-message"></p>

      <button class="confirm">Entrar</button>
    </form>
    <iframe
      name="iframe-resposta"
      id="iframe-resposta"
      style="display: none"
      onload="validateLogin()"
    ></iframe>
    <footer>© 2026 Cora Tech</footer>
  </body>
</html>
