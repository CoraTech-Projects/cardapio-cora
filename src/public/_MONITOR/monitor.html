<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor - Cardápio Cora</title>
    <link rel="stylesheet" href="/_MONITOR/monitor.css?v=4" />
    <script>
      const audio = document.createElement('audio');
      audio.src = '/assets/audios/ringtone1.mp3';

      let checkSync;
      let infos;
      let clockSave = JSON.parse(localStorage.getItem('monitor_on_clock'));

      function isDemo() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('demo') === 'true' || urlParams.has('demo');
      }

      function updateClock() {
        const now = new Date();
        const horasEl = document.getElementById('monitor-horas');
        if (horasEl) {
          horasEl.textContent = now.toLocaleTimeString('pt-BR');
        }

        const turnoEl = document.getElementById('turno');
        if (turnoEl) {
          const hours = now.getHours();
          if (hours >= 6 && hours < 12) {
            turnoEl.textContent = 'Turno da Manhã';
          } else if (hours >= 12 && hours < 18) {
            turnoEl.textContent = 'Turno da Tarde';
          } else {
            turnoEl.textContent = 'Turno da Noite';
          }
        }
      }

      async function filledSync() {
        if (infos) return;

        try {
          const query = isDemo() ? '?demo=true' : needSync();
          const response = await fetch('/cardapio' + query);
          if (!response.ok || response.status === 201) return;

          const data = await response.json();
          if (!data || !data.cardapio || !data.cardapio.prato) return;

          infos = data;

          let savedClock = JSON.parse(localStorage.getItem('monitor_on_clock'));

          if (!savedClock || !savedClock.timeToClear) {
            const targetTime = Date.now() + 10 * 60 * 1000;
            savedClock = { timeToClear: targetTime };
            localStorage.setItem(
              'monitor_on_clock',
              JSON.stringify(savedClock)
            );
          }

          const remainingTime = savedClock.timeToClear - Date.now();

          initMonitor();

          clearInterval(checkSync);

          if (remainingTime > 0) {
            setTimeout(clearAndVistorize, remainingTime);
          } else {
            clearAndVistorize();
          }
        } catch (err) {
          console.warn('[MONITOR] Erro na sincronização:', err);
        }
      }

      function clearAndVistorize() {
        const cardapioDiv = document.getElementById('cardapio-exibicao');
        if (cardapioDiv) cardapioDiv.style.display = 'none';

        checkSync = setInterval(filledSync, 3000);
        infos = null;
        localStorage.removeItem('monitor_on_clock');
        clockSave = null;
      }

      function needSync() {
        const currentClock = JSON.parse(
          localStorage.getItem('monitor_on_clock')
        );
        return currentClock ? '' : '/sync';
      }

      setInterval(updateClock, 1000);
      window.addEventListener('DOMContentLoaded', () => {
        updateClock();
        checkSync = setInterval(filledSync, 3000);
        filledSync();
      });
    </script>
    <script src="/_MONITOR/monitor.js?v=3"></script>
  </head>
  <body>
    <div id="monitor-content">
      <h1 id="monitor-horas">00:00:00</h1>
      <p id="turno">Turno da Manhã</p>
      <div class="frase">
        <img src="" alt="" />
        <h3>Cora Coralina</h3>
        <p>
          “Nada do que vivemos tem sentido, se não tocarmos o coração das
          pessoas.”
        </p>
      </div>
    </div>
  </body>
</html>
