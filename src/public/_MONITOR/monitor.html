<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor - Cardápio Cora</title>
    <link rel="stylesheet" href="/_MONITOR/monitor.css?v=4" />
    <script src="/_MONITOR/monitor.js"></script>
  </head>
  <body id="appBody" class="theme-manha">
    <!-- CABEÇALHO DO PAINEL -->
    <header class="header">
      <div class="brand-container">
        <div class="brand-icon">
         <img src='../assets/images/logo.png'>
        </div>
        <div>
          <h1 class="brand-title">CECC</h1>
          <p id="headerPeriodo" class="brand-subtitle">
            <span class="live-dot"></span> QUINTA-FEIRA • TURNO MANHÃ
          </p>
        </div>
      </div>

      <!-- RELÓGIO DIGITAL -->
      <div class="clock-box closed">
        <div id="clockTime" class="clock-time">00:00:00</div>
        <div id="clockDate" class="clock-date">CARREGANDO...</div>
      </div>
    </header>

    <!-- ÁREA CENTRAL DE CARROSSEL DE CARDS -->
    <main class="main-container">
      <div class="slides-wrapper">
        <div id="clock" class="card active">
          <div class="card-left">
            <div class="badge-primary">
              <i class="fa-solid fa-utensils"></i> alunos em Hórario de Aula
            </div>
            <div class="card-title-subtitle">
              <span class="card-subtitle">Refeição hoje</span>
              <h2 id="cardapioTitulo" class="card-title">Arroz Carreteiro</h2>
            </div>
            <div class="clock">
              <div class="clock-time">00:00:00</div>
              <div class="clock-date">Carregando....</div>
            </div>
          </div>
          <div class="card-right">
            <div class="icon-bubble" style="background: #fde047">
              <i class="icon-book"></i>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- CONTROLES DO CARROSSEL -->
    <div class="controls-wrapper closed">
      <div class="dots-container">
        <button class="dot-btn" onclick="goToSlide(0)">
          <div class="dot-progress" id="dot-0"></div>
        </button>
        <button class="dot-btn" onclick="goToSlide(1)">
          <div class="dot-progress" id="dot-1"></div>
        </button>
        <button class="dot-btn" onclick="goToSlide(2)">
          <div class="dot-progress" id="dot-2"></div>
        </button>
        <button class="dot-btn" onclick="goToSlide(3)">
          <div class="dot-progress" id="dot-3"></div>
        </button>
      </div>
      <div id="categoryLabel" class="category-label">Cardápio da Merenda</div>
    </div>

    <!-- RODAPÉ MARQUEE (MENSAGENS CONTINUAS) -->
    <footer class="marquee-footer">
      <div class="marquee-badge">
        <span class="material-icons">notifications</span> Notícias Rápidas
      </div>
      <div class="marquee-track" id="marqueeTrack">
        <!-- Injetado via Javascript -->
      </div>
    </footer>
  </body>
</html>
